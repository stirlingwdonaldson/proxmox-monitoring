global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: smartctl
    static_configs:
      - targets:
          - 192.168.4.124:9633
        labels:
          hostname: pve

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: monitoring-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: pve
    metrics_path: /pve

    params:
      module:
        - default
      cluster:
        - "1"
      node:
        - "1"

    static_configs:
      - targets:
          - 192.168.4.124

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: node
    static_configs:
      - targets:
          - 192.168.4.124:9100
        labels:
          hostname: pve
